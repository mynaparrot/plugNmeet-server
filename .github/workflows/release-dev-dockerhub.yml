name: Test and release to DockerHub as Dev
on:
  push:
    branches:
      - 'main'

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mynaparrot/plugnmeet-server:base
    services:
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_REDIS_HOST: redis:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure CGO for the Speech SDK
        run: |
          set -euo pipefail
          ARCH="$(dpkg --print-architecture)"
          case "$ARCH" in
            amd64) SPEECHSDK_ARCH_DIR="x64" ;;
            arm64) SPEECHSDK_ARCH_DIR="arm64" ;;
            *)
              echo "Unsupported architecture for the Speech SDK: $ARCH"
              exit 1
              ;;
          esac
          {
            echo "CGO_ENABLED=1"
            echo "CGO_CFLAGS=-I${SPEECHSDK_ROOT}/include/c_api"
            echo "CGO_LDFLAGS=-L${SPEECHSDK_ROOT}/lib/${SPEECHSDK_ARCH_DIR} -lMicrosoft.CognitiveServices.Speech.core"
            echo "LD_LIBRARY_PATH=${SPEECHSDK_ROOT}/lib/${SPEECHSDK_ARCH_DIR}"
          } >> "$GITHUB_ENV"

      - name: Cache Go modules and build cache
        uses: actions/cache@v4
        with:
          path: |
            /go/pkg/mod
            /root/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  build:
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/plugnmeet-server
          tags: |
            type=raw,value=dev-${{ matrix.arch }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker-build/Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false # To prevent manifest list error
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/plugnmeet-server:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/plugnmeet-server:buildcache-${{ matrix.arch }},mode=max

  push-manifest:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Create and push manifest
        run: |
          docker manifest create ${{ secrets.DOCKERHUB_USERNAME }}/plugnmeet-server:dev \
            --amend ${{ secrets.DOCKERHUB_USERNAME }}/plugnmeet-server:dev-amd64 \
            --amend ${{ secrets.DOCKERHUB_USERNAME }}/plugnmeet-server:dev-arm64
          docker manifest push ${{ secrets.DOCKERHUB_USERNAME }}/plugnmeet-server:dev
