name: Test Pull Request

on:
  pull_request:
    branches:
      - 'main'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mynaparrot/plugnmeet-server:base
    services:
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_REDIS_HOST: redis:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure CGO for the Speech SDK
        run: |
          set -euo pipefail
          ARCH="$(dpkg --print-architecture)"
          case "$ARCH" in
            amd64) SPEECHSDK_ARCH_DIR="x64" ;;
            arm64) SPEECHSDK_ARCH_DIR="arm64" ;;
            *)
              echo "Unsupported architecture for the Speech SDK: $ARCH"
              exit 1
              ;;
          esac
          {
            echo "CGO_ENABLED=1"
            echo "CGO_CFLAGS=-I${SPEECHSDK_ROOT}/include/c_api"
            echo "CGO_LDFLAGS=-L${SPEECHSDK_ROOT}/lib/${SPEECHSDK_ARCH_DIR} -lMicrosoft.CognitiveServices.Speech.core"
            echo "LD_LIBRARY_PATH=${SPEECHSDK_ROOT}/lib/${SPEECHSDK_ARCH_DIR}"
          } >> "$GITHUB_ENV"

      - name: Cache Go modules and build cache
        uses: actions/cache@v4
        with:
          path: |
            /go/pkg/mod
            /root/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...
