upload_file_settings:
  # If multiple plugNmeet servers are used, ensure all can access this directory.
  # Otherwise, file retrieval may fail. This path can be an NFS or other network-accessible location.
  path: "./upload"
  # Maximum file size for chat uploads in MB. Default is 50MB.
  max_size: 50
  # Maximum file size for whiteboard uploads in MB. Default is 30MB.
  max_size_whiteboard_file: 30
  # If true, uploaded files will not be deleted after the session ends.
  keep_forever: false
  allowed_types: ["jpg","png","jpeg","svg","pdf","docx","txt","xlsx","pptx","zip","mp4","webm","mp3"]

recorder_info:
  # This path must match the recorder's copy_to_dir > main_path setting.
  recording_files_path: "./recording_files"
  # How long generated token will valid to download the file
  token_validity: 30m
  # How long to wait before considering a recorder inactive. default: 8 seconds
  ping_timeout: 8s
  # If true, deleted recordings will be moved to a backup directory instead of being immediately removed.
  # But it will be removed from the database only.
  # This allows recovery in case of accidental deletion.
  enable_del_recording_backup: true
  # Optional: Specify a separate path for deleted recording backups.
  # Uses os.Rename for fast path changes. Ensure both paths are on the same disk to avoid cross-device errors.
  del_recording_backup_path: "./recording_files/del_backup"
  # Duration to retain deleted recordings in backup, in hours. Default is 72 hours (3 days).
  del_recording_backup_duration: 72h

analytics_settings:
  # Enable to generate a detailed analytics file after each session.
  # This file contains valuable metadata about user engagement, such as join/leave times,
  # feature usage, and total speaking duration, helping you understand how your
  # platform is being used.
  enabled: true

artifacts_settings:
  # The root path where all generated artifacts (summaries, etc.) will be stored.
  # Each room will have its own subdirectory: {storage_path}/{service_type}/{room_id}/
  storage_path: "./artifacts"
  # Download token validity duration in minutes. Default is 10 minutes.
  token_validity: 10m
  # If true, deleted artifacts will be moved to a backup directory instead of being immediately removed.
  enable_del_artifacts_backup: true
  # Optional: Specify a separate path for deleted artifact backups.
  # Default is a "trash" folder inside the main storage_path.
  del_artifacts_backup_path: "./artifacts/trash"
  # Duration to retain deleted artifacts in backup, in hours. Default is 72 hours (3 days).
  del_artifacts_backup_duration: 72h

insights:
  enabled: true
  # 1. Define all available provider accounts ONCE.
  # The key ("azure", "google") is the provider TYPE.
  providers:
    azure:
      # A list of uniquely identified accounts for this provider.
      - id: "eastus_standard" # A unique name you choose for this account
        credentials:
          api_key: "YOUR_AZURE_KEY_1"
          region: "eastus"
      #  options: {} # Generic options for this provider account, e.g., custom endpoints

      - id: "transGlobal"
        credentials:
          api_key: "YOUR_AZURE_KEY_1"
          region: "global"
        options:
            endpoint: "https://api.cognitive.microsofttranslator.com/translate?api-version=3.0"

    google:
      - id: "default-gemini-creds"
        credentials:
          api_key: "YOUR_GEMINI_API_KEY_HERE"

    openai:
      - id: "default-openai"
        credentials:
          api_key: "YOUR_OPENAI_API_KEY"
        options:
          endpoint: "https://api.openai.com/v1" # Optional: Override default endpoint

    # Realtime avatars (lip-synced video of the AI agent). These accounts are
    # only used when services.ai_agent.options.avatar_provider is set or a room
    # asks for an avatar. A room may bring its own key instead.
    # beyond_presence:
    #   - id: "default-avatar"
    #     credentials:
    #       api_key: "YOUR_BEYOND_PRESENCE_API_KEY"
    #     options:
    #       avatar_id: "your-avatar-id" # default avatar of this account
    # anam:
    #   - id: "default-avatar"
    #     credentials:
    #       api_key: "YOUR_ANAM_API_KEY"
    #     options:
    #       avatar_id: "your-avatar-id"
    # simli:
    #   - id: "default-avatar"
    #     credentials:
    #       api_key: "YOUR_SIMLI_API_KEY"
    #     options:
    #       avatar_id: "your-avatar-id"

  # 2. Define the services that USE the providers.
  # The key ("transcription", "translation", "ai_text_chat", "meeting_summarizing") is the service name.
  services:
    transcription:
      provider: "azure"         # The provider TYPE to use
      id: "eastus_standard" # The specific account ID to use from the list above
      options:
        model: "default"          # A model ID specific to this service
        max_selected_trans_langs: 2
      pricing:
        default: # Corresponds to the model name in options
          price_per_hour: 1.00

    # Google Gemini: live streaming speech-to-text. The live models read the
    # participant's audio as it arrives; gemini-3.5-transcribe (without -live)
    # only accepts uploaded files.
    # transcription:
    #   provider: "google"
    #   id: "default-gemini-creds"
    #   options:
    #     model: "gemini-3.5-transcribe-live"  # default
    #     # VERBATIM (default) keeps fillers; SMART cleans the text up but can
    #     # rewrite what the participant said.
    #     transcribe_mode: "VERBATIM"
    #     # Gemini Live (BidiGenerateContent) currently requires "v1beta".
    #     api_version: "v1beta"
    #     max_selected_trans_langs: 2
    #   pricing:
    #     default:
    #       price_per_hour: 0.60

    translation:
      provider: "azure"
      id: "transGlobal"
      options:
        max_selected_trans_langs: 5
      pricing:
        default: # A generic key for services with one pricing model
          price_per_million_characters: 10.00 # Example for Standard tier

    # Google Gemini: text translation for the translation service and for the
    # multi-language output of a transcription.
    # translation:
    #   provider: "google"
    #   id: "default-gemini-creds"
    #   options:
    #     translate_model: "gemini-3.1-flash-lite"  # default
    #     # Without translate_model, "model" is used only when it is a text
    #     # model; a transcribe/live/tts model falls back to the default above.
    #     max_selected_trans_langs: 5
    #   pricing:
    #     translate_model:
    #       input_price_per_million_tokens: 0.10
    #       output_price_per_million_tokens: 0.40

    speech-synthesis:
      provider: "azure"
      id: "eastus_standard"
      options:
        voice-en: "en-US-JennyNeural"
        voice-bn: "bn-IN-TanishaaNeural"
        voice-fr: "fr-FR-DeniseNeural"
        voice-de: "de-DE-KatjaNeural"
        voice-es: "es-ES-ElviraNeural"
      pricing:
        default: # A generic key for services with one pricing model
          price_per_million_characters: 16.00 # Example for Neural voice

    # Google Gemini: the TTS models read the language from the text, so only
    # the voice matters. Output is raw 16-bit PCM at tts_sample_rate.
    # speech-synthesis:
    #   provider: "google"
    #   id: "default-gemini-creds"
    #   options:
    #     model: "gemini-3.8-flash-tts"  # default
    #     default_voice: "Kore"          # default; 30 prebuilt voices, e.g. Puck, Aoede
    #     tts_sample_rate: 16000         # 8000, 16000 (default) or 24000
    #     api_version: "v1beta"          # required by the Interactions API
    #   pricing:
    #     default:
    #       price_per_million_characters: 15.00

    ai_text_chat:
      provider: "google"
      id: "default-gemini-creds"
      options:
        chat_model: "gemini-2.5-pro"
        summarize_model: "gemini-2.0-flash"
        context_window: 5 # Number of recent messages to keep before summarizing
      pricing:
        gemini-2.5-pro:
          input_price_per_million_tokens: 3.50
          output_price_per_million_tokens: 10.50
        gemini-2.0-flash:
          input_price_per_million_tokens: 0.35
          output_price_per_million_tokens: 0.70

    meeting_summarizing:
      provider: "google"
      id: "default-gemini-creds"
      options:
        # The model to be used for the final summarization.
        summarize_model: "gemini-2.0-flash"
      pricing:
        gemini-2.0-flash:
          input_price_per_million_tokens: 0.35
          output_price_per_million_tokens: 0.70

    # AI agent (virtual teacher): a visible in-room voice assistant with a
    # server-owned topic boundary. The room enables it through
    # room_features.insights_features.ai_agent_features (see the API docs).
    ai_agent:
      provider: "google"
      id: "default-gemini-creds"
      options:
        # Model used for the bidirectional realtime session (audio in and out).
        realtime_model: "gemini-3.8-live"
        # Text model used for rolling conversation summarization and at room end
        # to refine the AI_AGENT_SESSION_SUMMARY artifact. Leave it unset to use
        # the deterministic local summary without LLM synthesis.
        summarize_model: "gemini-3.1-flash-lite"
        # Optional: Gemini Live (BidiGenerateContent) currently requires "v1beta".
        # Leave unset to use the genai SDK default.
        api_version: "v1beta"
        # Optional realtime avatar: the agent's voice drives a lip-synced video.
        # A room can override both values; the key comes from the avatar account
        # below unless the room brings its own.
        # avatar_provider: "beyond_presence" # beyond_presence, anam or simli
        # avatar_id: "your-avatar-id"
        # avatar_account_id: "default-avatar" # account to take the key from
      pricing:
        realtime_model:
          input_price_per_million_tokens: 0.75        # Text input
          audio_input_price_per_million_tokens: 3.00  # Audio input
          image_input_price_per_million_tokens: 1.00  # Image / video input
          output_price_per_million_tokens: 4.50       # Text & thinking output
          audio_output_price_per_million_tokens: 12.00 # Audio output
        summarize_model:
          input_price_per_million_tokens: 0.25
          output_price_per_million_tokens: 1.50
        # The avatar stream is billed per minute of generated video.
        # avatar_model:
        #   price_per_minute: 0.10

    # OpenAI: use provider "openai" with an account from the accounts section.
    # Models prefixed with "gpt-live" use the Live SDK; every other model uses
    # the Realtime SDK, including OpenAI-compatible self-hosted servers.
    # A Realtime session is billed per token, a Live session per minute for the
    # speech model plus per token for its delegated text model.
    # ai_agent:
    #   provider: "openai"
    #   id: "default-openai-creds"
    #   options:
    #     # Realtime: the session model prices prompt/completion tokens.
    #     realtime_model: "gpt-realtime-2.1-mini"  # default; "gpt-realtime-2.1" for the full model
    #     # Live: set live_model instead of realtime_model. The speech model never
    #     # sees the tools, so delegation_model is required and the server refuses
    #     # to start without it.
    #     # live_model: "gpt-live-1"
    #     # delegation_model: "gpt-6-luna"
    #     # Text model used once at room end to refine AI_AGENT_SESSION_SUMMARY.
    #     # summarize_model: "gpt-5.4-mini"
    #     # default_voice: "marin"
    #     # Realtime only: self-hosted servers usually need their own turn
    #     # detection and may not support input transcription.
    #     # turn_detection: "semantic_vad"         # semantic_vad (default), server_vad, none
    #     # input_transcription_model: "gpt-transcribe"  # or "gpt-live-transcribe" (no VAD), "none" disables
    #     # realtime_auth_header: "Authorization"  # e.g. "api-key" for self-hosted gateways
    #   pricing:
    #     realtime_model:
    #       input_price_per_million_tokens: 0.60
    #       cached_input_price_per_million_tokens: 0.06
    #       output_price_per_million_tokens: 2.40
    #       audio_input_price_per_million_tokens: 10.00
    #       audio_cached_input_price_per_million_tokens: 0.30
    #       audio_output_price_per_million_tokens: 20.00
    #       image_input_price_per_million_tokens: 0.80
    #       image_cached_input_price_per_million_tokens: 0.08
    #     # Minute-priced: the live speech model reports audio duration only.
    #     live_model:
    #       price_per_minute: 0.05
    #     # Token-priced: the delegated text model of the live session. Cached
    #     # and cache-write rates (per modality too) are optional; without them
    #     # those tokens are billed as uncached input.
    #     delegation_model:
    #       input_price_per_million_tokens: 0.10
    #       cached_input_price_per_million_tokens: 0.01
    #       cache_write_input_price_per_million_tokens: 0.125
    #       output_price_per_million_tokens: 0.50
    #     # Token-priced: the summary written at room end.
    #     summarize_model:
    #       input_price_per_million_tokens: 0.25
    #       output_price_per_million_tokens: 2.00
    #     # A token-priced realtime_model entry works the same way for the
    #     # Realtime SDK; concrete model names and "default" are the fallbacks.

